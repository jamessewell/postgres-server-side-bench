<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="title desc">
  <title id="title">Client-observed Wikipedia COUNT latency</title>
  <desc id="desc">Unsmoothed one-second median latency buckets from sequential 30-second k6 runs. ParadeDB stays near 1.6 milliseconds while TIN stays near 3.6 milliseconds.</desc>

  <rect width="840" height="440" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="839" height="439" fill="none" stroke="#e2e8f0"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="24" y="30" fill="#0f172a" font-size="16" font-weight="700">Client-observed Wikipedia COUNT latency</text>
    <text x="24" y="50" fill="#64748b" font-size="11">8 concurrent clients · sequential 30-second runs · p50</text>

    <line x1="70" y1="76" x2="94" y2="76" stroke="#7c3aed" stroke-width="3"/>
    <text x="103" y="80" fill="#334155" font-size="11" font-weight="600">ParadeDB</text>
    <text x="162" y="80" fill="#64748b" font-size="11">1.633 ms</text>

    <line x1="276" y1="76" x2="300" y2="76" stroke="#ea580c" stroke-width="3"/>
    <text x="309" y="80" fill="#334155" font-size="11" font-weight="600">TIN</text>
    <text x="334" y="80" fill="#64748b" font-size="11">3.639 ms</text>

    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="70" y1="100" x2="770" y2="100"/>
      <line x1="70" y1="180" x2="770" y2="180"/>
      <line x1="70" y1="260" x2="770" y2="260"/>
      <line x1="70" y1="340" x2="770" y2="340"/>
    </g>

    <g fill="#64748b" font-size="10" text-anchor="end">
      <text x="60" y="104">4.0</text>
      <text x="60" y="184">3.0</text>
      <text x="60" y="264">2.0</text>
      <text x="60" y="344">1.0</text>
    </g>

    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="70" y1="100" x2="70" y2="340"/>
      <line x1="70" y1="340" x2="770" y2="340"/>
    </g>

    <g fill="#64748b" font-size="10" text-anchor="middle">
      <text x="70" y="358">0s</text>
      <text x="186.7" y="358">5s</text>
      <text x="303.3" y="358">10s</text>
      <text x="420" y="358">15s</text>
      <text x="536.7" y="358">20s</text>
      <text x="653.3" y="358">25s</text>
      <text x="770" y="358">30s</text>
    </g>

    <text x="420" y="381" fill="#64748b" font-size="10" text-anchor="middle">Elapsed time</text>
    <text x="18" y="220" fill="#64748b" font-size="10" text-anchor="middle" transform="rotate(-90 18 220)">milliseconds</text>

    <polyline
      points="81.7,290.2 105.0,284.5 128.3,283.4 151.7,292.2 175.0,294.7 198.3,289.4 221.7,284.0 245.0,287.3 268.3,293.4 291.7,285.0 315.0,288.2 338.3,288.6 361.7,291.6 385.0,294.4 408.3,289.7 431.7,290.6 455.0,291.2 478.3,287.5 501.7,287.5 525.0,285.8 548.3,290.6 571.7,286.7 595.0,287.7 618.3,289.3 641.7,294.7 665.0,287.2 688.3,290.5 711.7,293.4 735.0,295.0 758.3,289.7"
      fill="none"
      stroke="#7c3aed"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="3"
    />
    <polyline
      points="81.7,132.0 105.0,125.4 128.3,131.0 151.7,126.2 175.0,131.4 198.3,127.0 221.7,127.6 245.0,126.6 268.3,125.2 291.7,123.8 315.0,126.4 338.3,128.3 361.7,131.7 385.0,124.4 408.3,133.0 431.7,129.0 455.0,131.6 478.3,125.1 501.7,128.1 525.0,128.3 548.3,129.7 571.7,131.5 595.0,129.2 618.3,131.4 641.7,131.6 665.0,130.0 688.3,127.8 711.7,132.1 735.0,128.9 758.3,134.2"
      fill="none"
      stroke="#ea580c"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="3"
    />

    <text x="24" y="410" fill="#64748b" font-size="10">One-second buckets from 194,906 raw client-observed query durations; lines are unsmoothed.</text>
    <text x="24" y="426" fill="#64748b" font-size="10">Sequential runs are aligned by elapsed time; legend values are unsmoothed full-run results.</text>
  </g>
</svg>
